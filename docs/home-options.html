<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poze — Home, 4 card options</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#0c0c14;color:#f5f5fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:30px 20px 46px}
  h1{font-size:21px;font-weight:800;text-align:center}
  .sub{color:#9a9aa6;text-align:center;font-size:13px;margin:4px 0 26px}
  .row{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
  .col{width:300px}
  .cap{margin-top:12px}.cap .n{font-weight:800;font-size:15px}.cap .d{color:#9a9aa6;font-size:12px;margin-top:2px;line-height:1.4}
  .phone{width:300px;height:660px;border-radius:38px;border:9px solid #000;overflow:hidden;position:relative;box-shadow:0 20px 46px rgba(0,0,0,.55)}
  .scr{position:absolute;inset:0;background:#0a0a14;overflow:hidden;display:flex;flex-direction:column}
  .scr::before{content:"";position:absolute;inset:-30% -20%;z-index:0;filter:blur(20px);
    background:radial-gradient(38% 30% at 20% 8%,rgba(124,92,255,.5),transparent 60%),
      radial-gradient(34% 26% at 84% 6%,rgba(34,211,238,.4),transparent 60%),
      radial-gradient(42% 34% at 66% 96%,rgba(255,93,162,.32),transparent 62%)}
  .bar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800}
  .logo{width:22px;height:22px;border-radius:50%;background:linear-gradient(120deg,#7c5cff,#22d3ee);position:relative;box-shadow:0 3px 12px rgba(124,92,255,.6)}
  .logo::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid #fff}
  .pill{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
  .body{position:relative;z-index:1;padding:8px 16px 16px;overflow:auto;flex:1}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#9a9aa6;margin:12px 0 8px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .card{border-radius:16px;padding:14px;min-height:92px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.4)}
  .badge{position:absolute;top:11px;right:11px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.2)}
  .when{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
  .name{font-size:17px;font-weight:850;letter-spacing:-.02em;margin-top:1px}
  .place{font-size:11.5px;opacity:.9}

  /* A · glass + dot */
  .A .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:saturate(160%) blur(12px)}
  .A .card .dot{position:absolute;top:14px;left:14px;width:9px;height:9px;border-radius:50%}
  .A .g1 .dot{background:#2fdd9b;box-shadow:0 0 10px #2fdd9b}
  .A .g2 .dot{background:#7c5cff;box-shadow:0 0 10px #7c5cff}
  .A .g3 .dot{background:#22d3ee;box-shadow:0 0 10px #22d3ee}
  .A .g4 .dot{background:#ff5da2;box-shadow:0 0 10px #ff5da2}

  /* B · aurora tonale */
  .B .g1{background:linear-gradient(135deg,#4f46e5,#7c5cff)}
  .B .g2{background:linear-gradient(135deg,#6d28d9,#a855f7)}
  .B .g3{background:linear-gradient(135deg,#1e5fbf,#22d3ee)}
  .B .g4{background:linear-gradient(135deg,#0e7490,#22d3ee)}

  /* C · jewel mats */
  .C .g1{background:linear-gradient(135deg,#243b6b,#3a5488)}
  .C .g2{background:linear-gradient(135deg,#4a2f5e,#6d4b7a)}
  .C .g3{background:linear-gradient(135deg,#5e2a3a,#874a5a)}
  .C .g4{background:linear-gradient(135deg,#1f4b4a,#2f6b62)}

  /* D · noir + liseré */
  .D .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);padding-left:20px}
  .D .card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:3px}
  .D .g1::before{background:#2fdd9b;box-shadow:0 0 12px #2fdd9b}
  .D .g2::before{background:#7c5cff;box-shadow:0 0 12px #7c5cff}
  .D .g3::before{background:#22d3ee;box-shadow:0 0 12px #22d3ee}
  .D .g4::before{background:#ff5da2;box-shadow:0 0 12px #ff5da2}
</style>
</head>
<body>
  <h1>Poze — home screen, 4 card options</h1>
  <div class="sub">Same page, the four card treatments in real context.</div>
  <div class="row" id="row"></div>
<script>
  const opts=[
    ['A','A · Verre dépoli','Cartes verre + point coloré. Le plus sobre.'],
    ['B','B · Aurora tonale','Famille violet/cyan, cohérent, sans arc-en-ciel.'],
    ['C','C · Jewel mats','Tons profonds feutrés (nuit, prune, sapin).'],
    ['D','D · Noir + liseré','Quasi noir + trait qui glow. Minimal, chic.'],
  ];
  const cards=`
    <div class="lbl">With friends</div>
    <div class="stack">
      <div class="card g1"><span class="dot"></span><span class="badge">🤝 Open</span><span class="when">On your phone</span><span class="name">Your shared photos</span></div>
    </div>
    <div class="lbl">Events</div>
    <div class="stack">
      <div class="card g2"><span class="dot"></span><span class="badge">🪩 Open</span><span class="when">Last Saturday</span><span class="name">Le Duplex</span><span class="place">Paris · Club</span></div>
      <div class="card g3"><span class="dot"></span><span class="badge">🎪 Open</span><span class="when">2 weeks ago</span><span class="name">Sunset Festival</span><span class="place">Marseille · Beach</span></div>
      <div class="card g4"><span class="dot"></span><span class="badge">🏃 Open</span><span class="when">Last month</span><span class="name">Color Run</span><span class="place">Lyon · Park</span></div>
    </div>`;
  document.getElementById('row').innerHTML = opts.map(([c,n,d])=>`
    <div class="col ${c}">
      <div class="phone"><div class="scr">
        <div class="bar"><span class="brand"><span class="logo"></span>Poze</span><span class="pill">🔄 3</span></div>
        <div class="body">${cards}</div>
      </div></div>
      <div class="cap"><div class="n">${n}</div><div class="d">${d}</div></div>
    </div>`).join('');
</script>
</body>
</html>
