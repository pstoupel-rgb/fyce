name: PhotosPartagees
options:
  bundleIdPrefix: com.photospartagees
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PhotosPartagees:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: PhotosPartagees
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photospartagees.app
        INFOPLIST_FILE: PhotosPartagees/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    # Pour utiliser le SDK officiel Supabase à la place de l'implémentation REST :
    # dependencies:
    #   - package: Supabase
    # packages:
    #   Supabase:
    #     url: https://github.com/supabase/supabase-swift
    #     from: 2.0.0

  PhotosPartageesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotosPartageesTests
    dependencies:
      - target: PhotosPartagees
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photospartagees.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PhotosPartagees:
    build:
      targets:
        PhotosPartagees: all
        PhotosPartageesTests: [test]
    test:
      targets:
        - PhotosPartageesTests
